<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Product Gallery</title>
  </head>
  <body>
    <div class="demo">
      <!-- ============ YOUR MARKUP ============ -->
      <div
        class="wrapper"
        id="slider"
        tabindex="0"
        style="--per-view: 1; --gap: 0px"
      >
        <button class="arrow" data-go="prev" aria-label="Previous">‹</button>
        <button class="arrow" data-go="next" aria-label="Next">›</button>

        <div class="container">
          <div class="track">
            <div class="item">
              <img src="https://picsum.photos/id/1015/600/400" alt="" />
            </div>
            <div class="item">
              <img src="https://picsum.photos/id/1016/600/400" alt="" />
            </div>
            <div class="item">
              <img src="https://picsum.photos/id/1018/600/400" alt="" />
            </div>
            <div class="item">
              <img src="https://picsum.photos/id/1019/600/400" alt="" />
            </div>
            <div class="item">
              <img src="https://picsum.photos/id/1024/600/400" alt="" />
            </div>
            <div class="item">
              <img src="https://picsum.photos/id/1025/600/400" alt="" />
            </div>
            <div class="item">
              <img src="https://picsum.photos/id/1027/600/400" alt="" />
            </div>
            <div class="item">
              <img src="https://picsum.photos/id/1035/600/400" alt="" />
            </div>
            <div class="item">
              <img src="https://picsum.photos/id/1038/600/400" alt="" />
            </div>
            <div class="item">
              <img src="https://picsum.photos/id/1039/600/400" alt="" />
            </div>
          </div>
        </div>

        <!-- dots: N buttons + one sliding .indicator -->
        <div class="dots" data-nav>
          <span class="indicator"></span>
        </div>

        <!-- thumbnails: viewport shows --thumb-per at a time; strip pages; frame lives INSIDE the strip -->
        <div class="thumbs-viewport" data-thumbs>
          <div class="thumbs-strip">
            <span class="frame"></span>
          </div>
        </div>
      </div>
      <!-- ============ /YOUR MARKUP ============ -->
    </div>

    <script src="./script.js"></script>
  </body>
</html>
