<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./css/components/pophover.css" />
    <title>Popover Hover Menu</title>
  </head>
  <body class="popover-hover">
    <div class="card">
      <button
        class="menu-toggle"
        command="toggle-popover"
        commandfor="card-menu-1"
        interestfor="card-menu-1"
        style="anchor-name: --card-1"
      >
        <span class="screenreader-only">Open Menu!</span>
        <span class="aria-hidden">•••</span>
      </button>

      <menu popover="hint" id="card-menu-1" style="position-anchor: --card-1">
        <li><button>This</button></li>
        <li><button>Little</button></li>
        <li><button>Piggy</button></li>
        <li><button>Went</button></li>
        <li><button>to Market!</button></li>
      </menu>
    </div>
  </body>
</html>
